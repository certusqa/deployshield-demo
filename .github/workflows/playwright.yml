name: DeployShield — Pre-deploy gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pre-deploy-gate:
    name: Critical flows (deploy cleared / blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: practice-client/package-lock.json

      - name: Install dependencies
        working-directory: practice-client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: practice-client
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: practice-client
        run: npm run typecheck

      - name: Run critical-flow gate
        id: gate
        working-directory: practice-client
        run: npm test

      - name: Build Slack/Jira-shaped alert payload
        if: always()
        working-directory: practice-client
        run: npm run alert:payload

      - name: Summarize gate result
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "## Deploy cleared" >> "$GITHUB_STEP_SUMMARY"
            echo "Critical Playwright flows passed. Safe to proceed with deploy from a QA gate perspective." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Critical Playwright flows failed. Do not deploy until the suite is green. Download **playwright-report**, **test-results**, and **deployshield-alert-payload** artifacts from this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: practice-client/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: practice-client/test-results/
          retention-days: 7

      - name: Upload alert payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployshield-alert-payload
          path: practice-client/alert-artifacts/
          retention-days: 7
