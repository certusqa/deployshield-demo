name: DeployShield — Playwright Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  playwright-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: practice-client/package-lock.json

      - name: Install dependencies
        working-directory: practice-client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: practice-client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression suite
        working-directory: practice-client
        run: npm test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: practice-client/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: practice-client/test-results/
          retention-days: 7
